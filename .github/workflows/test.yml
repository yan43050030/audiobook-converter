name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimal: 不装任何可选依赖，验证 tts_engine/asr_engine 的可选导入降级路径
        # full:    安装 requirements.txt，验证完整依赖下的行为
        deps: [minimal, full]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # full 腿额外装系统语音/音频工具，让引擎与 IO 层集成测试真正执行；
      # minimal 腿不装，验证可选依赖缺失时的降级与测试跳过路径。
      - name: Install system audio tools (full)
        if: matrix.deps == 'full'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies (full)
        if: matrix.deps == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
