name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimal: 不装任何可选依赖，验证 tts_engine/asr_engine 的可选导入降级路径
        # full:    安装 requirements.txt，验证完整依赖下的行为
        deps: [minimal, full]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 测试框架（两腿都装）：pytest 运行全部用例，httpx 供 Web UI 的 TestClient 使用。
      # 这些是测试工具，不属于应用可选依赖，不影响 minimal 腿的降级验证。
      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx

      # full 腿额外装系统语音/音频工具，让引擎与 IO 层集成测试真正执行；
      # 以及 Qt 运行所需的系统库（缺 libEGL 等时 GUI 测试会整体跳过）。
      # minimal 腿不装，验证可选依赖缺失时的降级与测试跳过路径。
      - name: Install system audio tools (full)
        if: matrix.deps == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies (full)
        if: matrix.deps == 'full'
        run: |
          pip install -r requirements.txt
          # Web UI 可选依赖，让 tests/test_web.py 在 full 腿真正执行
          pip install fastapi uvicorn python-multipart

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          AUDIOBOOK_LANG: zh
        run: python -m pytest tests -v
